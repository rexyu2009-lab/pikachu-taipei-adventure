html,body{margin:0;height:100%;background:#17132b;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:'Cubic',sans-serif;color:#fff}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px}
#c{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid #3b3557;border-radius:6px;box-shadow:0 0 0 3px #0c0a18}
#pad{display:none;justify-content:space-between;align-items:center;width:100%;max-width:440px;padding:4px 20px 10px;box-sizing:border-box}
body.touch #pad{display:flex}
.dpad{position:relative;width:138px;height:138px}
.dpad button{position:absolute;width:46px;height:46px;background:#3b3557;border:none;color:#cfc8f0;font-size:20px;font-family:inherit;border-radius:6px;padding:0}
.dpad .c{left:46px;top:46px;background:#3b3557;border-radius:0;pointer-events:none}
#bu{left:46px;top:0;border-radius:6px 6px 0 0}#bd{left:46px;top:92px;border-radius:0 0 6px 6px}#bl{left:0;top:46px;border-radius:6px 0 0 6px}#br{left:92px;top:46px;border-radius:0 6px 6px 0}
.ab{display:flex;gap:14px;align-items:center;transform:rotate(-18deg)}
.ab button{width:64px;height:64px;border-radius:50%;border:none;font-family:inherit;font-size:22px;color:#fff;box-shadow:0 4px 0 #0006}
#ba{background:#d6455d;margin-top:-30px}#bb{background:#8a7fb8;width:52px;height:52px;font-size:18px}
button.on{filter:brightness(1.35)}
#help{font-size:12px;color:#a9a1d0;text-align:center;line-height:1.6}
body.touch #help{display:none}
#mute{position:fixed;top:8px;right:8px;z-index:5;background:#3b3557;color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:12px;padding:6px 10px}
</style>
</head>

  burst(kind, x, y, n, spread = 40) { for (let i = 0; i < n; i++) this.add({ kind, x: x + rnd(-10, 10), y: y + rnd(-6, 6), vx: rnd(-spread, spread), vy: rnd(-55, -20), life: rnd(.9, 1.5), delay: rnd(0, .4) }); }

      say(L, () => { sfx('flee'); this.leaving = this.t; say([n + '開心地回到草叢裡了～'], () => this.exit(), { rect: this.R }); }, { rect: this.R });
    }
  }
  doFX(kind, fav) {
    const ex = 172, ey = 72, px = 72, py = 168;
    if (kind === 'sweat') { sfx('sweat'); this.sad = this.t; for (let k = 0; k < 6; k++) this.fx.add({ kind: 'sweat', x: ex + rnd(-20, 20), y: ey - 10, vx: rnd(-25, 25), vy: rnd(-40, -10), g: 120, life: .9, delay: k * .08 }); this.fx.add({ kind: 'text', s: '？', x: ex + 24, y: ey - 26, vy: -8, life: 1.6, col: '#5a8cff' }); return; }
    if (kind === 'none') return;
    sfx(kind === 'flash' ? 'cam' : 'happy'); this.happy = this.t;
    if (kind === 'flash') this.flash = 1;
    const n = fav ? 18 : 9;
    const k2 = kind === 'notes' ? 'note' : kind === 'stars' ? 'star' : kind === 'steam' ? 'steam' : 'heart';
    this.fx.burst(k2, ex, ey, n); this.fx.burst(kind === 'hearts' ? 'heart' : 'spark', px, py, Math.ceil(n / 2));
    if (kind === 'sparkle' || kind === 'food') this.fx.burst('star', ex, ey, 5);
    if (fav) { this.icon = { t: this.t, k: 'icon_' + this.A.icon }; this.fx.add({ kind: 'text', s: '好感度UP！', x: 172, y: 120, vy: -14, life: 1.8 }); }
  }
  join() {
    G.befriended[this.ai] = true; if (!G.friends.includes(this.mon)) G.friends.push(this.mon);
    sfx('join'); this.happy = this.t; this.fx.burst('heart', 172, 70, 24, 60);
    say(this.A.joinLines, () => this.exit(), { rect: this.R });
  }
  exit() { this.phase = 'out'; fadeTo(() => { setScene(this.back); this.back.enc = null; setMusic('area' + this.ai); }); }
  draw() {
    const t = this.t; ctx.drawImage(IM['bb' + this.ai], 0, 0);
    const p = eo(t / 0.45);
    const ex = lerp(-60, 170, p), px = lerp(300, 72, p);
    const hp = this.t - this.happy < 1.6 ? Math.abs(Math.sin((this.t - this.happy) * 10)) * 8 : 0;
    const sad = this.t - this.sad < 1 ? Math.sin((this.t - this.sad) * 30) * 2 : 0;
    let lx = 0, la = 1; if (this.leaving >= 0) { const q = clamp((t - this.leaving) / .5); lx = q * 140; la = 1 - q; }
    ctx.save(); ctx.globalAlpha = la; anim(this.mon, t, ex + sad + lx, 120 - hp, 2); ctx.restore();
    anim('pikachu_back', t, px, 228 - (hp ? hp * .5 : 0), 2);
    if (this.icon) { const q = t - this.icon.t; if (q < 2.2) { const s = 2 * eback(q / .3); img(IM['s_' + this.icon.k], 52, 92 + Math.sin(q * 6) * 2, 'mm', false, Math.max(.1, s)); } }
    this.fx.draw();
    if (this.flash > 0) { ctx.save(); ctx.globalAlpha = this.flash; rect(0, 0, LW, LH, '#fff'); ctx.restore(); }
    const pe = eo((t - .35) / .3);
    if (pe > 0) {
      const ox = lerp(-130, 0, pe); infoBox(6 + ox, 10, 120, 36); txt(NAME(this.mon), 14 + ox, 14, '#404040', '#d8d0b0'); txt('Lv5', 118 + ox, 14, '#404040', '#d8d0b0', 12, 'right');
      hpBar(44 + ox, 32, 74, 1);
      if (this.t - this.happy < 3) img(IM.s_heart, 124 + ox, 12, 'mm');
      const ox2 = lerp(130, 0, pe); infoBox(128 + ox2, 166, 108, 50); txt('皮卡丘', 136 + ox2, 170, '#404040', '#d8d0b0'); txt('Lv25', 228 + ox2, 172, '#404040', null, 12, 'right');
      hpBar(158 + ox2, 188, 70, 1); txt('35/35', 228 + ox2, 196, '#404040', '#d8d0b0', 12, 'right');
    }
    const [x, y, w, h] = this.R;
    if (UI.dialog) UI.dialog.draw();
    else { dlgBox(x, y, w, h); if (this.phase === 'menu') txt('要和' + NAME(this.mon) + '一起做什麼？', x + 11, y + 10); }
    if (this.phase === 'menu' || (this.phase === 'react' && UI.dialog)) {
      dlgBox(2, 276, 236, 42);
      this.opts.forEach((o, i) => {
        const cx = 16 + (i % 2) * 112, cy = 283 + Math.floor(i / 2) * 15;
        const tried = this.tried.has(i) && this.key && i !== this.A.fav;
        txt(o, cx, cy, tried ? '#a8a8b0' : '#484850', tried ? null : '#d0d0d8');
        if (i === this.sel && this.phase === 'menu') cursorTri(cx - 8, cy + 2);
      });
    }
  }
}

// ---------------------------------------------------------------- MRT
class MRTScene {
  constructor(ai) { this.ai = ai; this.t = 0; this.done = false; this.bld = []; let x = 0; while (x < 900) { const w = 14 + Math.random() * 26; this.bld.push([x, w, 30 + Math.random() * 90, Math.random()]); x += w + 2; } }
  enter() { setMusic('mrt'); }
  update(dt) {
    this.t += dt;
    if (this.t > 4.6 && !this.done) {
      this.done = true; const ai = this.ai + 1;
      const intros = [null, ['到達士林站了！', '天色暗了，夜市的香味', '從前面飄過來了～'], ['到達北投站了！', '空氣裡有淡淡的溫泉味…', '冒著熱氣的地熱谷就在附近！'], ['到達象山站了！', '抬頭就能看到台北101！', '沿著步道爬上觀景台吧！']];
      fadeTo(() => setScene(new MapScene(ai, intros[ai])), '#fff');
    }
  }
  draw() {
    const t = this.t; const night = this.ai === 0;
    vgrad(0, 200, night ? [[30, 30, 80], [120, 70, 130]] : [[110, 180, 245], [230, 240, 255]], 8);
    const off = t * 60;
    for (const [x, w, h, r] of this.bld) { const xx = ((x - off) % 900 + 900) % 900 - 60; rect(xx, 200 - h, w, h, night ? '#2c2850' : '#8ca0c8'); if (night) for (let yy = 200 - h + 4; yy < 196; yy += 6) for (let k = 2; k < w - 2; k += 5) if ((k * 7 + yy + Math.floor(r * 50)) % 3 == 0) rect(xx + k, yy, 2, 2, '#ffdc82'); }
    rect(0, 200, LW, 120, night ? '#3c3458' : '#7cbc6c'); rect(0, 196, LW, 10, '#b4b4bc'); rect(0, 206, LW, 4, '#8c8c96');
    for (let x = -((t * 400) % 40); x < LW; x += 40) rect(x, 210, 6, 40, '#a0a0aa');
    const tx = lerp(250, -330, clamp((t - 0.3) / 3.8)); const bob = Math.sin(t * 30) * .5;
    for (let c = 0; c < 3; c++) {
      const x0 = tx + c * 104, y0 = 150 + bob; rrect(x0, y0, 100, 48, 6, '#f0f0f4'); rect(x0, y0 + 34, 100, 5, '#e3002c'); rect(x0, y0 + 40, 100, 2, '#0070bd');
      for (let k = 0; k < 4; k++) { rect(x0 + 8 + k * 23, y0 + 8, 18, 18, '#5a7896'); }
      const who = ['pikachu'].concat(G.friends);
      for (let k = 0; k < 4; k++) { const idx = c * 4 + k; if (idx < who.length) img(IM['i_' + who[idx]], x0 + 17 + k * 23, y0 + 27, 'mb', false, 0.6); }
      rect(x0 + 10, y0 + 48, 14, 4, '#333'); rect(x0 + 76, y0 + 48, 14, 4, '#333');
    }
    drawHUD(this.ai, t, clamp((t - .3) / 3.8));
    dlgBox(20, 250, 200, 50); txt('下一站：' + ST_N[this.ai + 1], 120, 260, '#484850', '#d0d0d8', 12, 'center'); txt('Next Station: ' + ['Shilin', 'Beitou', 'Xiangshan'][this.ai], 120, 278, '#7880a0', null, 12, 'center');
  }
}

// ---------------------------------------------------------------- title
class TitleScene {
  constructor() { this.t = 0; this.go = -1; this.tapA = true; }
  enter() { setMusic('title'); }
  update(dt) {
    this.t += dt;
    if (aPress && this.go < 0 && this.t > 0.6) { this.go = this.t; sfx('start'); initAudio(); }
    if (this.go >= 0 && this.t - this.go > 0.7 && !this.started) {
      this.started = true; newGame();
      fadeTo(() => setScene(new MapScene(0, ['這裡是台北！', '皮卡丘今天要展開一場台北小旅行！', '聽說每個景點都有可愛的寶可夢，', '在等著和大家交朋友…', '搭上捷運，一站一站去拜訪吧！', '（方向鍵移動，A 鍵對話、調查。）', '先在西門町和龍山寺逛逛吧！'])), '#fff', .5);
    }
  }
  draw() {
    const t = this.t; ctx.drawImage(IM.title, 0, 0);
    [[20, 120, 1, 9], [150, 150, .8, 6], [90, 100, .6, 12], [220, 180, .9, 7]].forEach(([x, y, s, v]) => cloud(((x + t * v) % 290) - 25, y, s));
    ['mew', 'dragonite', 'butterfree', 'swablu'].forEach((n, k) => { const x = (k * 80 + t * (16 + k * 6)) % 320 - 40; ctx.save(); ctx.globalAlpha = .35; img(silhouette('f_' + n, '#fff'), x, 150 + k * 14 + Math.sin(t * 2 + k) * 5, 'mb', true); ctx.restore(); });
    let x = 80, y = 268;
    const jp = clamp((t - .6) / .55); x = lerp(-40, 80, jp); y = 268 - Math.sin(Math.PI * jp) * 80; if (t > 1.15) { x = 80; const h = ((t - 1.15) % 2.5) / .35; y = 268 - (h < 1 ? Math.sin(Math.PI * h) * 16 : 0); }
    ctx.save(); ctx.globalAlpha = .25; ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(x, 268, 24, 4, 0, 0, 7); ctx.fill(); ctx.restore();
    anim('pikachu', t, x, y, 2);
    if (t > 1.15 && Math.floor(t * 8) % 3 != 0) for (let k = 0; k < 3; k++) { const a = k * 2.1 + Math.floor(t * 6); const bx = x + Math.cos(a) * 52, by = y - 46 + Math.sin(a) * 40; ctx.strokeStyle = '#fff050'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + 4, by + 5); ctx.lineTo(bx - 1, by + 7); ctx.lineTo(bx + 5, by + 13); ctx.stroke(); }
    const lp = eback((t - .1) / .6); const ly = lerp(-120, 36, lp);
    otxt('皮卡丘的', 120, ly, '#ffd600', '#2850aa', 2, 24, 'center', '#141e50', 2.5);
    otxt('台北大冒險', 120, ly + 32, '#ffd600', '#2850aa', 2, 24, 'center', '#141e50', 2.5);
    if (t > .8) otxt('～台北景點巡禮～', 120, 104, '#fff', '#c83c64', 1, 12, 'center');
    const per = this.go >= 0 ? .12 : .8;
    if (t > 1 && (t % per) < per * .6) otxt('PRESS START', 120, 288, '#fff', '#1e285a', 1.5, 12, 'center');
    txt('寶可夢圖片：PokéAPI', 238, 310, '#ffffffaa', null, 12, 'right');
  }

// ---------------------------------------------------------------- ending
class EndingScene {
  constructor() { this.t = 0; this.tapA = true; this.stars = []; for (let i = 0; i < 70; i++) this.stars.push([Math.random() * 240, Math.random() * 170, Math.random()]); this.fw = []; this.nextFw = 1.2; this.popped = 0; }
  enter() { setMusic('ending'); }
  update(dt) {
    this.t += dt;
    if (this.t > this.nextFw) { this.nextFw = this.t + rnd(.35, .8); const cols = ['#ff78aa', '#78dcff', '#ffe65a', '#b48cff', '#78ffa0', '#ffa050', '#fff']; this.fw.push({ t: 0, x: rnd(20, 220), y: rnd(30, 140), c: cols[Math.floor(Math.random() * cols.length)] }); if (this.t > 1.5) sfx('boom'); }
    this.fw.forEach(f => f.t += dt); this.fw = this.fw.filter(f => f.t < 1.6);
    const n = Math.floor((this.t - 3.2) / .07); if (n > this.popped && this.popped < 12) { this.popped = n; sfx('pop'); }
    if (this.t > 6.5 && aPress) { sfx('start'); newGame(); fadeTo(() => setScene(new TitleScene()), '#fff', .5); }
  }
  draw() {
    const t = this.t, n = clamp(t / 2.6);
    const sky = [lerpc([96, 70, 160], [8, 10, 36], n), lerpc([255, 120, 90], [34, 26, 80], n), lerpc([255, 200, 110], [90, 50, 110], n)];
    vgrad(0, 250, sky, 14);
    for (const [x, y, ph] of this.stars) { const a = n * (.5 + .5 * Math.sin(t * 4 + ph * 20)); if (a > .35) rect(x, y, 1, 1, rgb(lerpc([120, 120, 160], [255, 255, 230], a))); }
    if (n < 1) { const sy = 200 + n * 70; ctx.fillStyle = rgb(lerpc([255, 230, 140], [255, 140, 90], n)); ctx.beginPath(); ctx.arc(190, sy, 14, 0, 7); ctx.fill(); }
    if (n > .5) { ctx.save(); ctx.globalAlpha = (n - .5) * 2; ctx.fillStyle = '#faf5d2'; ctx.beginPath(); ctx.arc(34, 40, 8, 0, 7); ctx.fill(); ctx.fillStyle = rgb(sky[0]); ctx.beginPath(); ctx.arc(38, 37, 8, 0, 7); ctx.fill(); ctx.restore(); }
    ctx.fillStyle = rgb(lerpc([140, 90, 140], [30, 30, 70], n)); ctx.beginPath(); ctx.moveTo(0, 260); for (let x = 0; x <= 240; x += 4) ctx.lineTo(x, 222 - 10 * (.6 * Math.sin(x * .04 + 1.2) + .4 * Math.sin(x * .09 + 2))); ctx.lineTo(240, 260); ctx.fill();
    ctx.drawImage(silhouette('endCity', rgb(lerpc([100, 70, 120], [24, 24, 56], n))), 0, 0);
    ctx.save(); ctx.globalAlpha = n; ctx.drawImage(IM.endWin, 0, 0); ctx.restore();
    const lit = Math.floor(clamp((t - .8) / 1.6) * 8.001);
    const top = draw101(120, 252, 1.5, rgb(lerpc([110, 120, 150], [40, 60, 90], n)), rgb(lerpc([80, 80, 120], [24, 36, 64], n)), rgb(lerpc([70, 70, 100], [20, 30, 50], n)), lit);
    if (Math.floor(t * 3) % 2) rect(119, top - 2, 2, 2, '#ff3c3c');
    // fireworks
    for (const f of this.fw) { const q = f.t; if (q < .3) { rect(f.x, lerp(250, f.y, eo(q / .3)), 1, 2, '#ffe0b0'); continue; } const qq = q - .3, r = 26 * eo(qq / .6); ctx.save(); ctx.globalAlpha = 1 - clamp((qq - .6) / .7); ctx.fillStyle = f.c; for (let a = 0; a < 16; a++) { const an = a * Math.PI / 8; const x = f.x + Math.cos(an) * r, y = f.y + Math.sin(an) * r + qq * qq * 12; rect(x, y, 1.5, 1.5, f.c); rect(lerp(x, f.x, .15), lerp(y, f.y, .15), 1, 1, f.c); } ctx.restore(); }
    poly([[0, 256], [80, 250], [160, 252], [240, 248], [240, 320], [0, 320]], rgb(lerpc([90, 60, 70], [20, 18, 34], n)));
    rect(0, 268, LW, 2, rgb(lerpc([140, 90, 60], [50, 36, 40], n))); for (let x = 0; x < LW; x += 14) rect(x, 268, 2, 14, rgb(lerpc([120, 80, 50], [44, 32, 36], n)));
    const line = ['bulbasaur', 'eevee', 'pikachu', 'jigglypuff', 'psyduck'], xs = [30, 74, 120, 166, 210];
    line.forEach((m, k) => { let hop = 0; const q = t - .3 - k * .12; if (q > 0 && q < .35) hop = Math.sin(Math.PI * q / .35) * 10; if (t > 4.6) { const q2 = (t - 4.6 - k * .1) % 1.1; if (q2 < .3) hop = Math.sin(Math.PI * q2 / .3) * 5; } img(IM['b_' + m], xs[k], 314 - hop); });
    ctx.save(); ctx.globalAlpha = clamp((t - 2.4) / .8) * .45 + n * .15; rect(0, 0, LW, LH, '#060614'); ctx.restore();
    const L1 = '你也想要來段', L2 = '台北旅程嗎？';
    [[L1, 104], [L2, 146]].forEach(([s, cy], li) => { [...s].forEach((ch, ci) => {
      const idx = li * 6 + ci, q = (t - 3.2 - idx * .07) / .22; if (q <= 0) return;
      const sc = q < 1 ? 1 + 1.2 * (1 - eback(q)) : 1; const fl = t > 4.4 ? Math.sin(t * 3 + idx * .6) * 1.5 : 0;
      ctx.save(); ctx.translate(120 - 78 + ci * 26 + 13, cy + 12 + fl); ctx.scale(sc, sc); otxt(ch, 0, -12, '#fff', '#181e50', 2, 24, 'center', '#ffaa28', 2.5); ctx.restore(); }); });
    if (t > 4.4) { for (let k = 0; k < 6; k++) { const ph = (t * 1.5 + k / 6) % 1; if (ph < .5) img(IM.s_spark, [24, 216, 40, 200, 120, 14][k], [96, 100, 182, 186, 84, 150][k], 'mm'); } }
    if (t > 6.5) { const b = Math.floor(t * 2) % 2; if (b) otxt('按 A 鍵再玩一次', 120, 206, '#ffd63c', '#181e50', 1, 12, 'center'); txt('寶可夢圖片・名稱：PokéAPI', 120, 226, '#c8c0e8', null, 12, 'center'); }
    if (t > 4.2 && t < 6.5) txt('～ 旅程完成 ～', 120, 206, '#ffffffcc', null, 12, 'center');
  }
}

// ---------------------------------------------------------------- loop
let last = 0, ready = false;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  if (ready && scene) {
    if (!fade) scene.update(dt);
    if (fade) { fade.t += dt; if (fade.phase === 0 && fade.t >= fade.dur) { fade.phase = 1; fade.t = 0; fade.fn(); } else if (fade.phase === 1 && fade.t >= fade.dur) fade = null; }
    ctx.setTransform(2, 0, 0, 2, 0, 0); ctx.imageSmoothingEnabled = false;
    scene.draw();
    if (fade) { ctx.save(); ctx.globalAlpha = fade.phase === 0 ? clamp(fade.t / fade.dur) : 1 - clamp(fade.t / fade.dur); rect(0, 0, LW, LH, fade.col); ctx.restore(); }
  }
  aPress = false; bPress = false; dirPress = [];
  requestAnimationFrame(frame);
}
function drawLoading() { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#17132b'; ctx.fillRect(0, 0, 480, 640); ctx.fillStyle = '#fff'; ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Loading…', 240, 320); }
drawLoading();
loadAll().then(() => {
  ready = true;
  const q = new URLSearchParams(location.search).get('debug') || '';
  const m = q.match(/^(area|battle|mrt)(\d)$/);
  const pre = k => { for (let i = 0; i < k; i++) { G.befriended[i] = true; G.friends.push(D.areas[i].keyMon); } if (k > 0) G.card = true; };
  if (m && m[1] === 'area') { const k = +m[2] - 1; pre(k); setScene(new MapScene(k)); }
  else if (m && m[1] === 'battle') { const k = +m[2] - 1; pre(k); const ms = new MapScene(k); scene = ms; setScene(new Battle(k, D.areas[k].keyMon, true, ms)); }
  else if (m && m[1] === 'mrt') { const k = +m[2] - 1; pre(k + 1); setScene(new MRTScene(k)); }
  else if (q === 'ending') { pre(4); setScene(new EndingScene()); }
  else setScene(new TitleScene());
  requestAnimationFrame(frame);
});
window.__dbg = {
  get G() { return G; }, get scene() { return scene; }, get dialog() { return UI.dialog; },
  sceneName: () => scene && scene.constructor.name,
  tp(x, y, dir) { if (scene instanceof MapScene) { Object.assign(scene.p, { x, y, fx: x, fy: y, moving: false, dir: dir || scene.p.dir }); scene.hist = scene.hist.map(() => ({ x, y })); } },
  pos() { return scene && scene.p ? { x: scene.p.x, y: scene.p.y, dir: scene.p.dir, moving: scene.p.moving } : null; },
};
